<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>東寶牧場 | 現場作業系統</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --green-main: #10b981;
      --blue-listen: #3b82f6;
      --amber-speak: #f59e0b;
      --red-alert: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 76px 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .header {
      padding: 14px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: #0b1120;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-sub { font-size: 12px; color: var(--green-main); margin-top: 2px; }
    .operator-badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .container { padding: 12px 14px; max-width: 640px; margin: 0 auto; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    /* ===== 頂部模式切換器（互斥斷點設計） ===== */
    .mode-switch-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 4px;
      gap: 6px;
      margin-bottom: 12px;
    }
    .mode-tab-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-tab-btn.active {
      background: var(--green-main);
      color: #06281e;
    }

    /* ===== 主操作卡片 ===== */
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      margin-bottom: 12px;
    }
    .status-pill {
      display: inline-block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .status-pill.standby { background: rgba(148, 163, 184, 0.15); border-color: #64748b; color: #e2e8f0; }
    .status-pill.awake { background: rgba(59, 130, 246, 0.22); border-color: #60a5fa; color: #93c5fd; font-weight: 700; }
    .status-pill.recording { background: rgba(239, 68, 68, 0.2); border-color: #f87171; color: #fecaca; font-weight: 700; }
    .status-pill.speaking { background: rgba(245, 158, 11, 0.2); border-color: #fbbf24; color: #fcd34d; font-weight: 700; }

    .timer-display {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin: 4px 0 8px;
    }
    .mic-wrapper {
      position: relative;
      width: 136px;
      height: 136px;
      margin: 10px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--green-main);
      opacity: 0;
      pointer-events: none;
    }
    .mic-wrapper.is-standby .pulse-ring { background: #64748b; animation: pulse 2.8s infinite ease-out; }
    .mic-wrapper.is-awake .pulse-ring { background: var(--blue-listen); animation: pulse 1.3s infinite ease-out; }
    .mic-wrapper.is-recording .pulse-ring { background: var(--red-alert); animation: pulse 1.1s infinite ease-out; }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .mic-btn {
      position: relative;
      z-index: 2;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      border: none;
      background: #334155;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      padding: 8px;
    }
    .mic-btn.state-ready { background: radial-gradient(circle at 30% 30%, #34d399, #059669); color: #ffffff; }
    .mic-btn.state-standby { background: radial-gradient(circle at 30% 30%, #475569, #1e293b); border: 2px solid #94a3b8; color: #f8fafc; }
    .mic-btn.state-awake { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb); color: #ffffff; }
    .mic-btn.state-recording { background: radial-gradient(circle at 30% 30%, #f87171, #dc2626); color: #ffffff; }
    .mic-btn.state-speaking { background: radial-gradient(circle at 30% 30%, #fbbf24, #d97706); color: #ffffff; }
    .mic-icon { font-size: 32px; line-height: 1; }
    .hint-sub { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-top: 6px; }

    /* ===== 錄音批次模式專屬：系統回覆顯示區塊（無即時口說轉換框） ===== */
    .batch-reply-card {
      background: linear-gradient(145deg, #0f1
